name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Boundary check (no bot or broker package installed)
        shell: bash
        run: |
          if python -m pip list --format=freeze | grep -iE '^(webull|trade-guardian|radar|scout|pilot)'; then
            echo "a bot or broker package is installed"; exit 1
          fi
      - name: Tests
        run: python -m pytest -q
